<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* CSS_STYLES */
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 20px;
        }
        .name {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .contact-info {
            font-size: 16px;
            color: #7f8c8d;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 20px;
            color: #3498db;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .experience-item {
            margin-bottom: 20px;
        }
        .experience-item h3 {
            margin: 0;
            font-size: 18px;
            color: #2c3e50;
        }
        .position {
            font-style: italic;
            margin: 5px 0;
            color: #7f8c8d;
        }
        .date {
            color: #95a5a6;
            font-size: 14px;
            margin: 5px 0;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="name">{{name}}</div>
        <div class="contact-info">
            {{email}} | {{phone}}
        </div>
    </div>

    <div class="section">
        <div class="section-title">Опыт работы</div>
        {{experience}}
    </div>

    <div class="section">
        <div class="section-title">Образование</div>
        {{education}}
    </div>

    <div class="section">
        <div class="section-title">Навыки</div>
        {{skills}}
    </div>
</body>
</html>
